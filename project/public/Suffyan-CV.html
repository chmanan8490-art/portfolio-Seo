<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suffyan CV Image</title>
    <style>
        :root {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #07101f;
            color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 40%),
                linear-gradient(180deg, #0b1120 0%, #07101f 100%);
        }

        .container {
            width: min(1000px, 100%);
            text-align: center;
        }

        .message {
            margin: 0 auto 28px;
            max-width: 640px;
            padding: 28px 24px;
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .message p {
            margin: 0;
            font-size: 1rem;
            line-height: 1.8;
            color: #cbd5e1;
        }

        .message strong {
            color: #7dd3fc;
        }

        .cv-image {
            width: 100%;
            max-width: 900px;
            height: auto;
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.24);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
            background: #0f172a;
        }

        .note {
            margin-top: 16px;
            font-size: 0.92rem;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="container">
        
        <img class="cv-image" src="./M_Suffyan_Nadeem_SEO_Resume_Final_HD.png" alt="CV image placeholder">
    </div>
</body>

</html>
